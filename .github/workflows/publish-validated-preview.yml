name: Publish validated preview
on:
  push:
    branches:
      - feature/contact-activity-smart-proxy-voice-ghost
    paths:
      - .github/workflows/publish-validated-preview.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-validated-preview-18cf10a4
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 18cf10a431a8586246086fe7757309a5ca35e209
      TAG: parvagram-preview-18cf10a4
    steps:
      - name: Validate source and download existing artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/42932183104" --jq .head_sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/42932183104" --jq .conclusion)" = success
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13816863034/zip" > artifact.zip
          echo '603e80fd155e9e3c23ff27aa1fe50167a9163a56b15d5bdd1436166f68aad342  artifact.zip' | sha256sum -c -
      - name: Prepare separate APK assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, shutil, zipfile
          out = pathlib.Path("assets")
          out.mkdir()
          with zipfile.ZipFile("artifact.zip") as archive:
              for abi in ("arm64-v8a", "armeabi-v7a", "x86_64"):
                  names = [name for name in archive.namelist() if name.endswith(".apk") and abi in name]
                  if len(names) != 1:
                      raise RuntimeError("Expected exactly one APK for " + abi)
                  with archive.open(names[0]) as source, (out / ("Parvagram-" + abi + ".apk")).open("wb") as target:
                      shutil.copyfileobj(source, target, 1024 * 1024)
          PY
          echo 'dd2045160677f51fa8e8cce7cd48b4d97dc7794fae514b55c0ce6bb29c67231a  assets/Parvagram-arm64-v8a.apk' | sha256sum -c -
          (cd assets && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish user-authorized pre-release
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          نسخه آزمایشی پَرواگرام — 18cf10a4

          تغییرات:
          - اصلاح مسیرهای رسید شنیده شدن ویس و ویدیو مسیج در حالت روح
          - تایم لاین پروفایل و آرشیو عکس های قابل مشاهده مخاطبین با کنترل سهمیه و مدت نگهداری
          - تاریخچه فعالیت مشاهده شده و نمای جداگانه رسید خواندن پیام های ارسالی
          - انتخاب پروکسی بر اساس پایداری، کنترل فاصله تعویض و حفظ هسته قبلی هنگام شکست راه اندازی هسته جدید

          فایل مناسب گوشی های جدید: Parvagram-arm64-v8a.apk
          گوشی های قدیمی ۳۲ بیتی: Parvagram-armeabi-v7a.apk
          شبیه ساز x86_64: Parvagram-x86_64.apk

          اینها همان فایل های Build تایید شده 42932183104 از Commit 18cf10a431a8586246086fe7757309a5ca35e209 هستند؛ دوباره ساخته نشده اند.
          نوع ساخت assembleRelease با debuggable=false است، اما بهینه سازی R8 برای این خروجی توسعه خاموش بوده است.

          Build، بررسی امضا، ۱۰ تست ضروری و اجرای اولیه شبیه ساز پاس شده اند.
          ورود به حساب سرور تست تلگرام با خطای Wrong code مواجه شد؛ تایید نهایی ویس از سمت فرستنده، قابلیت های وابسته به حساب و تعویض واقعی V2Ray/VPN روی گوشی هنوز لازم است.

          این انتشار Pre-release است و به عنوان نسخه پایدار یا به روزرسانی خودکار معرفی نمیشود. هیچ شاخه ای Merge نشده است.
          گزارش فنی: https://github.com/mostafagl/Nagram/blob/7f3b1132c6f63ca4bcf7a040d62b1d9cfb431eb7/docs/DEVELOPMENT_PROGRESS.md
          NOTES
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace assets."
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets
            exit 0
          fi
          gh release create "$TAG" assets/*.apk assets/SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --draft --prerelease --latest=false --target "$SOURCE_SHA" --title "Parvagram preview · 18cf10a4" --notes-file notes.md
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets
