name: Pull request

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - '**.md'
      - '**.xml'

jobs:
  native:
    name: Native Build (Telegram)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor:
          - armeabi-v7a
          - arm64-v8a
          # Only for the emulator test: ARM translation on x86_64 can't run the Go V2Ray core.
          - x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch Status
        run: |
          sed -i 's/\/\///g' settings.gradle
      - name: Native Cache
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            TMessagesProj/src/main/libs
          key: ${{ hashFiles('TMessagesProj/jni/**') }}-${{ matrix.flavor }}
      - name: Checkout Library
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          packages: 'platform-tools'
      - name: Install NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "y" | sdkmanager --install "ndk;27.2.12479018" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/27.2.12479018" >> local.properties
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export NATIVE_TARGET="${{ matrix.flavor }}"
          ./run init libs
          ./run libs native
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    needs:
      - native
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch Status
        run: |
          sed -i 's/\/\///g' settings.gradle
      - name: Native Cache (armeabi-v7a)
        uses: actions/cache@v6
        with:
          path: |
            TMessagesProj/src/main/libs
          key: ${{ hashFiles('TMessagesProj/jni/**') }}-armeabi-v7a
      - name: Native Cache (arm64-v8a)
        uses: actions/cache@v6
        with:
          path: |
            TMessagesProj/src/main/libs
          key: ${{ hashFiles('TMessagesProj/jni/**') }}-arm64-v8a
      - name: Native Cache (x86_64)
        uses: actions/cache@v6
        with:
          path: |
            TMessagesProj/src/main/libs
          key: ${{ hashFiles('TMessagesProj/jni/**') }}-x86_64
      - name: Checkout Library
        run: |
          git submodule update --init
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install NDK
        run: |
          echo "y" | sdkmanager --install "ndk;27.2.12479018" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/27.2.12479018" >> local.properties
      - name: V2Ray Library Cache
        id: v2ray-cache
        uses: actions/cache@v6
        with:
          path: TMessagesProj/libs/libv2ray.aar
          key: libv2ray-${{ hashFiles('bin/libs/v2ray.sh') }}
      - name: Set up Go
        if: steps.v2ray-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - name: V2Ray Library Build
        if: steps.v2ray-cache.outputs.cache-hit != 'true'
        run: |
          ./run libs v2ray
      - name: Configure Gradle
        run: |
          sed -i "s/2000000000000/$(date +%s%N | cut -c1-13)/g" gradle.properties
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Debug Build
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export DEBUG_BUILD=true
          export EXTRA_ABI_X86_64=true
          sed -i 's/signingConfig signingConfigs.release//g' TMessagesProj/build.gradle
          ./gradlew TMessagesProj:assembleRelease --build-cache --no-configuration-cache

          APK=$(find TMessagesProj/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV
      - name: Verify APK signatures
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in $(find TMessagesProj/build/outputs/apk -name '*.apk'); do
            echo "== $f"
            "$BT/apksigner" verify --verbose --print-certs "$f"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: Debug
          path: ${{ env.APK }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash bin/scripts/smoke_test.sh
  uitest:
    name: Emulator UI test
    runs-on: ubuntu-latest
    needs:
      - build
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Debug
          path: apk
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Telethon
        run: pip install telethon==1.45.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run UI test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          UITEST_OUT: ${{ github.workspace }}/uitest-out
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash bin/scripts/uitest/run.sh apk
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bin/scripts/uitest/publish.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-test
          path: uitest-out
  release:
    name: Publish latest build to Releases
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Debug
          path: apk
      - name: Replace the parvagram-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          mkdir out
          cp apk/*arm64-v8a*.apk out/Parvagram-arm64-v8a.apk
          cp apk/*armeabi-v7a*.apk out/Parvagram-armeabi-v7a.apk
          VERSION=$(basename "$(ls apk/*arm64-v8a*.apk | head -1)" | sed -E 's/^Parvagram-(.*)-arm64-v8a\.apk$/\1/')
          cat > notes.md <<NOTES
          Latest Parvagram build ($VERSION) from commit ${SHA:0:8}.

          | Download | For |
          | --- | --- |
          | [Parvagram-arm64-v8a.apk](https://github.com/$REPO/releases/download/parvagram-latest/Parvagram-arm64-v8a.apk) | Almost all phones from 2017 on (64-bit), e.g. Samsung Galaxy A36 |
          | [Parvagram-armeabi-v7a.apk](https://github.com/$REPO/releases/download/parvagram-latest/Parvagram-armeabi-v7a.apk) | Older 32-bit phones |

          This build is signed with the debug key until a release key is set up, so it can't be
          installed over a build signed with a different key: uninstall that one first.
          NOTES
          gh release delete parvagram-latest -R "$REPO" --cleanup-tag -y || true
          gh release create parvagram-latest -R "$REPO" --prerelease --target "$SHA" \
            --title "Parvagram $VERSION (latest build)" --notes-file notes.md \
            out/Parvagram-arm64-v8a.apk out/Parvagram-armeabi-v7a.apk
