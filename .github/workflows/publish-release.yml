name: Publish release

# Turns a build pre-release (build-<timestamp>) into the latest full release, which the app
# offers as an update. Start it from the Actions tab with the build's tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Build tag, e.g. build-1793357419170'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --prerelease=false --latest
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url
